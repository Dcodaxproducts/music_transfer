name: matrix_ai
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  intl: ^0.19.0
  http: ^1.2.2
  shimmer: ^3.0.0
  iconsax: ^0.0.8
  shared_preferences: ^2.3.5
  cached_network_image: ^3.4.1
  flutter_smart_dialog: ^4.9.8+5
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_html: ^3.0.0-beta.2
  gallery_saver_plus: ^3.2.1
  share_plus: ^10.1.3
  lottie: ^3.2.0
  animated_text_kit: ^4.2.2
  flutter_staggered_grid_view: ^0.7.0
  connectivity_plus: ^6.1.1
  flutter_screenutil: ^5.9.3
  view_more: ^0.0.2
  photo_view: ^0.15.0
  package_info_plus: ^8.1.2
  upgrader: any
  app_settings: ^5.1.1
  dotted_border: ^2.1.0

  # Together AI
  together_ai_sdk: ^2.0.2

  # AWS s3 bucket
  minio_flutter:
    path: packages/minio_flutter

  # Facebook ads 
  easy_audience_network:
    path: packages/audience_network_flutter

  # Admob
  google_mobile_ads: 5.1.0 # do not change this version (xcode symbols not found issue)
  app_tracking_transparency: ^2.0.6+1

  # Firebase
  firebase_core: ^3.10.0
  firebase_analytics: ^11.4.0
  firebase_messaging: ^15.2.0
  firebase_crashlytics: ^4.3.0
  flutter_local_notifications: ^18.0.1

  # In-app purchase
  flutter_inapp_purchase: ^5.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

     

dependency_overrides: 
  win32: 5.5.4 # fix for iOS build issue (pubspec.lock)

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/language/
    - assets/images/
    - assets/animations/
    - assets/fonts/

  fonts:
      - family: Poppins
        fonts:
          - asset: assets/fonts/100.ttf
            weight: 100
          - asset: assets/fonts/200.ttf
            weight: 200
          - asset: assets/fonts/300.ttf
            weight: 300
          - asset: assets/fonts/400.ttf
            weight: 400
          - asset: assets/fonts/500.ttf
            weight: 500
          - asset: assets/fonts/600.ttf
            weight: 600
          - asset: assets/fonts/700.ttf
            weight: 700
          - asset: assets/fonts/800.ttf
            weight: 800
          - asset: assets/fonts/900.ttf
            weight: 900