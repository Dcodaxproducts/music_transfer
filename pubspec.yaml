name: pixart_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  intl: ^0.19.0
  http: ^1.2.2
  shimmer: ^3.0.0
  iconsax: ^0.0.8
  shared_preferences: ^2.3.5
  cached_network_image: ^3.4.1
  flutter_smart_dialog: ^4.9.8+5
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_html: ^3.0.0-beta.2
  gallery_saver_plus:
    path: packages/gallery_saver_plus
  share_plus: ^10.1.3
  animated_text_kit: ^4.2.2
  flutter_staggered_grid_view: ^0.7.0
  connectivity_plus: ^6.1.1
  flutter_screenutil: ^5.9.3
  view_more: ^0.0.2
  photo_view: ^0.15.0
  package_info_plus: ^8.1.2
  upgrader: any
  app_settings: ^5.1.1
  particles_fly: ^0.0.9
  flutter_native_splash: any

  # Facebook ads 
  easy_audience_network:
    path: packages/audience_network_flutter

  # Admob
  google_mobile_ads: ^6.0.0
  app_tracking_transparency: ^2.0.6+1

  # Firebase
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  firebase_analytics: ^12.1.0
  firebase_crashlytics: ^5.0.5
  firebase_performance: ^0.11.1+2
  flutter_local_notifications: ^19.5.0

  # RevenueCat for subscription management
  purchases_flutter: ^8.1.1
  purchases_ui_flutter: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  android: true
  ios: false
  web: false
  color_android: "#ffffff"
  color_dark_android: "#000000"
  image: assets/images/logo_icon.png

  android_12:
    color_android: "#ffffff"
    color_dark_android: "#000000"
    image: assets/images/logo_icon.png

     

dependency_overrides: 
  win32: 5.5.4 # fix for iOS build issue (pubspec.lock)

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/language/
    - assets/images/
    - assets/animations/
    - assets/fonts/

  fonts:
      - family: Poppins
        fonts:
          - asset: assets/fonts/100.ttf
            weight: 100
          - asset: assets/fonts/200.ttf
            weight: 200
          - asset: assets/fonts/300.ttf
            weight: 300
          - asset: assets/fonts/400.ttf
            weight: 400
          - asset: assets/fonts/500.ttf
            weight: 500
          - asset: assets/fonts/600.ttf
            weight: 600
          - asset: assets/fonts/700.ttf
            weight: 700
          - asset: assets/fonts/800.ttf
            weight: 800
          - asset: assets/fonts/900.ttf
            weight: 900