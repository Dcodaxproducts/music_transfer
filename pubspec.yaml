name: pixart_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  intl: ^0.20.2
  http: ^1.6.0
  uuid: ^4.5.2
  shimmer: ^3.0.0
  upgrader: ^12.5.0
  view_more: ^0.0.2
  photo_view: ^0.15.0
  share_plus: ^12.0.1
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  app_settings: ^7.0.0
  iconsax_flutter: ^1.0.1
  connectivity_plus: ^7.0.0
  flutter_screenutil: ^5.9.3
  gallery_saver_plus:
    path: packages/gallery_saver_plus
  shared_preferences: ^2.5.4
  cached_network_image: ^3.4.1
  flutter_smart_dialog: ^4.9.8+9
  flutter_staggered_grid_view: ^0.7.0

  # Image manipulation for watermarks
  image: ^4.7.2

  # Device info
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0

  # Admob
  google_mobile_ads: ^7.0.0

  # Firebase
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  firebase_analytics: ^12.1.1
  firebase_crashlytics: ^5.0.7
  firebase_performance: ^0.11.1+4
  flutter_local_notifications: ^20.0.0

  # Social Sign-In
  firebase_auth: ^6.1.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

  # RevenueCat for subscription management
  purchases_flutter: ^9.11.0
  purchases_ui_flutter: ^9.11.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
     

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/language/
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/grid/

  fonts:
      - family: Poppins
        fonts:
          - asset: assets/fonts/100.ttf
            weight: 100
          - asset: assets/fonts/200.ttf
            weight: 200
          - asset: assets/fonts/300.ttf
            weight: 300
          - asset: assets/fonts/400.ttf
            weight: 400
          - asset: assets/fonts/500.ttf
            weight: 500
          - asset: assets/fonts/600.ttf
            weight: 600
          - asset: assets/fonts/700.ttf
            weight: 700
          - asset: assets/fonts/800.ttf
            weight: 800
          - asset: assets/fonts/900.ttf
            weight: 900