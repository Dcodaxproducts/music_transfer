name: Dependency Check

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  check-dependencies:
    name: Check Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Flutter Version
        run: |
          if [ -f ".fvmrc" ]; then
            VERSION=$(cat .fvmrc | jq -r '.flutter // empty')
            [ -n "$VERSION" ] && echo "FLUTTER_VERSION=$VERSION" >> $GITHUB_ENV
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Check Outdated Dependencies
        run: |
          flutter pub outdated --json > outdated.json || true
          
          if [ ! -s outdated.json ]; then
            echo "MAJOR=0" >> $GITHUB_ENV
            echo "MINOR=0" >> $GITHUB_ENV
            echo "PATCH=0" >> $GITHUB_ENV
            exit 0
          fi
          
          # Count updates
          echo "Counting outdated packages..."
          TOTAL=$(jq '.packages | length' outdated.json 2>/dev/null || echo 0)
          echo "Total outdated: $TOTAL"
          
          # Simple classification - just count them
          echo "MAJOR=0" >> $GITHUB_ENV
          echo "MINOR=0" >> $GITHUB_ENV
          echo "PATCH=$TOTAL" >> $GITHUB_ENV
          echo "Found $TOTAL outdated dependencies"

      - name: Create Dependency Update PR
        if: env.PATCH != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          export BRANCH="deps/update-$(date +%s)"
          git checkout -b "$BRANCH"
          
          flutter pub upgrade
          flutter pub get
          
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git add pubspec.yaml pubspec.lock
          git commit -m "chore(deps): update dependencies"
          git push origin "$BRANCH"
          
          gh pr create \
            --title "chore(deps): update dependencies" \
            --body "Automated dependency updates via dependency check workflow" \
            --base development \
            --head "$BRANCH" \
            --label dependencies || true

      - name: Create Issue for Dependencies
        if: env.PATCH != '0'
        run: |
          export TODAY=$(date +%Y-%m-%d)
          gh issue create \
            --title "[Deps] Dependency updates available - $TODAY" \
            --body "Found ${{ env.PATCH }} outdated dependencies. Run flutter pub outdated locally to see details." \
            --label dependencies,maintenance || true
