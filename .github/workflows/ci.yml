name: CI - Code Quality & Tests

on:
  pull_request:
    branches: [develop, testing, main]

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  quality-checks:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Flutter Version
        run: |
          if [ -f ".fvmrc" ]; then
            export FLUTTER_V=$(cat .fvmrc | jq -r '.flutter // empty')
            [ -n "$FLUTTER_V" ] && echo "FLUTTER_VERSION=$FLUTTER_V" >> $GITHUB_ENV
          elif [ -f ".dcodax-ci.yaml" ]; then
            export FLUTTER_V=$(grep "flutter_version:" .dcodax-ci.yaml | sed 's/.*: *//')
            [ -n "$FLUTTER_V" ] && echo "FLUTTER_VERSION=$FLUTTER_V" >> $GITHUB_ENV
          fi
          echo "Using Flutter $FLUTTER_VERSION"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Get Dependencies
        run: flutter pub get

      - name: Validate Branch Name
        run: |
          export BRANCH="$GITHUB_HEAD_REF"
          if ! echo "$BRANCH" | grep -qE "^(feature|bugfix|hotfix|release)/"; then
            echo "Branch name must follow pattern: feature/*, bugfix/*, hotfix/* or release/*"
            exit 1
          fi
          echo "Branch name valid: $BRANCH"

      - name: Validate Commit Messages
        run: |
          export COMMITS=$(git log origin/$GITHUB_BASE_REF..HEAD --pretty=format:"%s")
          export VALID_TYPES="feat|fix|chore|docs|refactor|test|ci|perf|style|build"
          
          echo "$COMMITS" | while read -r msg; do
            [ -z "$msg" ] && continue
            if ! echo "$msg" | grep -qE "^($VALID_TYPES)(\(.+\))?: .+"; then
              echo "Invalid commit: $msg"
              echo "Required: type(scope): description"
              exit 1
            fi
          done
          echo "All commits valid"

      - name: Check Formatting
        run: dart format --set-exit-if-changed --line-length 80 . || exit 1

      - name: Analyze Code
        run: flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        run: flutter test --reporter expanded || true

      - name: Build APK
        run: flutter build apk --release

      - name: Check APK Size
        run: |
          export APK_SIZE=$(du -m build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "APK size: ${APK_SIZE}MB"
          if [ "$APK_SIZE" -gt 100 ]; then
            echo "APK exceeds 100MB limit"
            exit 1
          fi
