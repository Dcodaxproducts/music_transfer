name: Build APKs and Email

on:
  pull_request:
    branches:
      - production

jobs:
  build-apk:
    name: Build Debug and Release APKs
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Java
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '18'

      # Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      # Restore Keystore
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      # Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Build Debug APK
      - name: Build Debug APK
        run: flutter build apk --debug

      # Build Release APK
      - name: Build Release APK
        run: |
          flutter build apk --release \
          --dart-define=KEYSTORE_PATH=android/app/keystore.jks \
          --dart-define=KEYSTORE_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }} \
          --dart-define=KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
          --dart-define=KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}

      # Rename APK Files
      - name: Rename APK Files
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          APK_NAME=${{ github.repository }}
          if [ -z "$PR_TITLE" ]; then
            PR_TITLE=$APK_NAME
          fi
          mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/${PR_TITLE}_debug.apk
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${PR_TITLE}_release.apk

      # Upload APKs as Artifacts
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Debug APK
          path: build/app/outputs/flutter-apk/*_debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Release APK
          path: build/app/outputs/flutter-apk/*_release.apk

      # Retrieve Artifact URLs
      - name: Get Artifact URLs
        id: get_urls
        run: |
          debug_apk_url=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" | \
            jq -r '.artifacts[] | select(.name == "Debug APK") | .archive_download_url')
          
          release_apk_url=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" | \
            jq -r '.artifacts[] | select(.name == "Release APK") | .archive_download_url')
          
          echo "::set-output name=debug_apk_url::$debug_apk_url"
          echo "::set-output name=release_apk_url::$release_apk_url"

      # Email APKs
      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: dcodax.net
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }} # Specify the sender email
          subject: "New APKs Generated - ${{ github.event.pull_request.title }}"
          body: |
            The debug and release APKs have been generated. You can download them from the following links:
            
            - Debug APK: ${{ steps.get_urls.outputs.debug_apk_url }}
            - Release APK: ${{ steps.get_urls.outputs.release_apk_url }}
          to: "shafiquecbl@gmail.com,usamadcodax@gmail.com" # Add multiple recipients here
          attachments: |
            build/app/outputs/flutter-apk/*_debug.apk
            build/app/outputs/flutter-apk/*_release.apk
