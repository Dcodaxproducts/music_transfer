name: Build APKs and Upload and Send Email

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Pull Request Title (Optional)"
        required: false
      debug_apk:
        description: "Build Debug APK"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      release_apk:
        description: "Build Release APK"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      send_email:
        description: "Send Email with APK links"
        required: false
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

jobs:
  build-and-upload:
    name: Build APKs and Upload to TestFlight
    runs-on: macos-latest # Required for TestFlight upload

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Java
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "18"

      # Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"

      # Restore Keystore
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      # Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Build Debug APK (if requested)
      - name: Build Debug APK
        if: ${{ inputs.debug_apk == 'true' }}
        run: flutter build apk --debug

      # Build Release APK (if requested)
      - name: Build Release APK
        if: ${{ inputs.release_apk == 'true' }}
        run: |
          flutter build apk --release \
          --dart-define=KEYSTORE_PATH=android/app/keystore.jks \
          --dart-define=KEYSTORE_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }} \
          --dart-define=KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
          --dart-define=KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}

      # Rename APK Files
      - name: Rename APK Files
        run: |
          TITLE="${{ inputs.title || 'Untitled_PR' }}"
          if [ "${{ inputs.debug_apk }}" == "true" ]; then
            mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/${TITLE}_debug.apk
          fi
          if [ "${{ inputs.release_apk }}" == "true" ]; then
            mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${TITLE}_release.apk
          fi

      # Upload APKs as Artifacts (if built)
      - name: Upload Debug APK
        if: ${{ inputs.debug_apk == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Debug APK
          path: build/app/outputs/flutter-apk/*_debug.apk

      - name: Upload Release APK
        if: ${{ inputs.release_apk == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Release APK
          path: build/app/outputs/flutter-apk/*_release.apk

      # Retrieve Artifact URLs (if sending email)
      - name: Get Artifact Download URLs
        id: get_urls
        if: ${{ inputs.send_email == 'true' }}
        run: |
          artifacts=$(curl -s -H "Authorization: Bearer ${{ secrets.BEARER_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts")

          debug_apk_url=""
          release_apk_url=""
          if [ "${{ inputs.debug_apk }}" == "true" ]; then
            debug_artifact_id=$(echo "$artifacts" | jq -r '.artifacts[] | select(.name == "Debug APK") | .id')
            debug_apk_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/$debug_artifact_id"
          fi
          if [ "${{ inputs.release_apk }}" == "true" ]; then
            release_artifact_id=$(echo "$artifacts" | jq -r '.artifacts[] | select(.name == "Release APK") | .id')
            release_apk_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/$release_artifact_id"
          fi

          echo "DEBUG_APK_URL=$debug_apk_url" >> $GITHUB_ENV
          echo "RELEASE_APK_URL=$release_apk_url" >> $GITHUB_ENV

      # Email APKs (if requested)
      - name: Send Email
        if: ${{ inputs.send_email == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: dcodax.net
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USERNAME }}
          subject: "New APKs Generated - PixArt - ${{ inputs.title || 'Untitled_PR' }}"
          body: |
            The APKs have been generated. You can download them from the following links:

            - Debug APK: ${{ env.DEBUG_APK_URL }}
            - Release APK: ${{ env.RELEASE_APK_URL }}
          to: "shafiquecbl@gmail.com,usamadcodax@gmail.com,talhaali3390137@gmail.com"
