name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
      MATTERMOST_TOKEN: ${{ secrets.MATTERMOST_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(dart|yaml|gradle|swift|kt)$' || true)
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          FILE_COUNT=$(echo "$FILES" | grep -c '.' || echo "0")
          echo "count=$FILE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Get diff
        if: steps.changed.outputs.count != '0'
        id: diff
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(dart|yaml|gradle|swift|kt)$' || true)
          if [ -n "$FILES" ]; then
            DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- $FILES | head -c 50000 || true)
          else
            DIFF=""
          fi
          {
            echo "diff<<EOF"
            echo "$DIFF"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: AI Review (Together)
        if: steps.changed.outputs.count != '0'
        id: review
        run: |
          # Write files to avoid multiline issues
          echo '${{ steps.diff.outputs.diff }}' > /tmp/pr_diff.txt
          echo '${{ steps.changed.outputs.files }}' > /tmp/pr_files.txt
          
          cat > /tmp/prompt.txt << 'PROMPT'
          You are a senior Flutter/Dart code reviewer. Review this PR diff.

          Changed files:
          PROMPT
          cat /tmp/pr_files.txt >> /tmp/prompt.txt
          echo "" >> /tmp/prompt.txt
          echo "Diff:" >> /tmp/prompt.txt
          cat /tmp/pr_diff.txt >> /tmp/prompt.txt
          
          cat >> /tmp/prompt.txt << 'INSTRUCTIONS'

          Provide a concise review with:
          ## 📋 Summary
          Brief description of changes.

          ## ✅ What Looks Good
          Positive observations.

          ## ⚠️ Issues Found (severity levels)
          - 🔴 Blocker: Critical bugs, security issues, crashes
          - 🟡 Major: Architecture violations, performance issues, anti-patterns
          - 🟢 Minor: Style nits, readability, suggestions

          ## 💡 Suggestions
          Improvements for code quality, performance, or maintainability.

          ## 🔒 Security Notes
          Any security concerns (API keys, permissions, data handling).

          Be specific, reference line numbers, and keep it actionable.
          INSTRUCTIONS

          # Create JSON payload
          PROMPT_JSON=$(jq -Rs '{input: .}' /tmp/prompt.txt)
          
          REQUEST_BODY=$(jq -n \
            --arg model "together/moonshotai/Kimi-K2.5" \
            --argjson prompt "$PROMPT_JSON" \
            '{
              "model": $model,
              "messages": [{"role": "user", "content": $prompt.input}],
              "temperature": 0.3,
              "max_tokens": 4096
            }')

          RESPONSE=$(curl -s -X POST "https://api.together.xyz/v1/chat/completions" \
            -H "Authorization: Bearer $TOGETHER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$REVIEW" ] || [ "$REVIEW" = "null" ]; then
            echo "AI review failed - no content returned"
            echo "$RESPONSE"
            exit 1
          fi

          {
            echo "review<<EOF"
            echo "$REVIEW"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post review comment
        if: steps.changed.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let review;
            try {
              // Read review from step output or file
              review = `${{ steps.review.outputs.review }}`;
              if (!review || review === 'undefined') {
                throw new Error('Review content is empty');
              }
            } catch (e) {
              review = fs.readFileSync('/tmp/review_output.txt', 'utf8');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **AI Code Review (Kimi-K2.5)**\n\n${review}`
            });

      - name: Post error notice
        if: failure() && steps.changed.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **AI Review**: Failed to generate review. Please check workflow logs.'
            });

      - name: Skip notice
        if: steps.changed.outputs.count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 **AI Review**: No code files changed — skipping review.'
            });

      - name: Notify Mattermost on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const MM_URL = process.env.MATTERMOST_URL;
            const MM_TOKEN = process.env.MATTERMOST_TOKEN;
            const CHANNEL = 'bwgii3aooiy39cpy1tu7tcp6tc';
            const REPO_NAME = '${{ github.repository }}';
            const PR_NUMBER = ${{ github.event.pull_request.number }};
            const RUN_URL = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const message = `❌ **PR Review Failed** on PR #${PR_NUMBER} in \`${REPO_NAME}\`\\n[View Run](${RUN_URL})`;
            await fetch(`${MM_URL}/api/v4/posts`, {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${MM_TOKEN}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ channel_id: CHANNEL, message: message })
            });
        env:
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_TOKEN: ${{ secrets.MATTERMOST_TOKEN }}
