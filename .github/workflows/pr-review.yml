name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Branch & PR Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch: $BRANCH"
          if [[ ! "$BRANCH" =~ ^(feature|fix|hotfix|chore|refactor|release|ci|docs|test|perf|build)/ ]]; then
            echo "::error::Branch name '$BRANCH' does not follow convention: feature/*, fix/*, hotfix/*, chore/*, ci/*, etc."
            exit 1
          fi
          echo "✅ Branch name valid"

      - name: Validate PR title (conventional commit)
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $TITLE"
          if [[ ! "$TITLE" =~ ^(feat|fix|hotfix|chore|refactor|docs|style|test|perf|ci|build|revert)(\(.+\))?:\ .+ ]]; then
            echo "::error::PR title must follow conventional commit format: type(scope): description"
            echo "Examples: feat(auth): add login screen, fix(home): resolve null crash"
            exit 1
          fi
          echo "✅ PR title valid"

      - name: Validate commit messages
        run: |
          COMMITS=$(git log --format="%s" origin/${{ github.base_ref }}..HEAD)
          FAILED=0
          while IFS= read -r msg; do
            if [[ ! "$msg" =~ ^(feat|fix|hotfix|chore|refactor|docs|style|test|perf|ci|build|revert|Merge)(\(.+\))?:?\ .+ ]]; then
              echo "::warning::Non-conventional commit: $msg"
              FAILED=$((FAILED + 1))
            fi
          done <<< "$COMMITS"
          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::$FAILED commit(s) don't follow conventional format"
          fi
          echo "✅ Commit messages checked"

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Flutter version
        run: |
          if [ -f .fvmrc ]; then
            FLUTTER_VER=$(cat .fvmrc | jq -r '.flutter // empty')
          fi
          if [ -z "$FLUTTER_VER" ] && [ -f .fvm/fvm_config.json ]; then
            FLUTTER_VER=$(cat .fvm/fvm_config.json | jq -r '.flutterSdkVersion // empty')
          fi
          if [ -z "$FLUTTER_VER" ]; then
            FLUTTER_VER="3.x"
            echo "⚠️ No .fvmrc found, using Flutter $FLUTTER_VER"
          else
            echo "Using Flutter $FLUTTER_VER from project config"
          fi
          echo "FLUTTER_VER=$FLUTTER_VER" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VER }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting (120-char line limit)
        run: |
          dart format --set-exit-if-changed --line-length=120 . > /tmp/format_output.txt 2>&1 || true
          while IFS= read -r line; do
            FILE=$(echo "$line" | sed 's/^Formatted //')
            if [ -f "$FILE" ]; then
              echo "::warning file=$FILE::File needs formatting (120-char line limit)"
            fi
          done < <(grep "^Formatted " /tmp/format_output.txt || true)

      - name: Flutter analyze
        run: |
          flutter analyze --no-fatal-infos > /tmp/analyze_output.txt 2>&1 || true
          while IFS= read -r line; do
            FILE=$(echo "$line" | cut -d' ' -f1 | cut -d':' -f1)
            LINE_NUM=$(echo "$line" | cut -d':' -f2)
            MSG=$(echo "$line" | sed 's/^[^-]*- //')
            if echo "$line" | grep -q " error "; then
              echo "::error file=$FILE,line=$LINE_NUM::$MSG"
            elif echo "$line" | grep -q " warning "; then
              echo "::warning file=$FILE,line=$LINE_NUM::$MSG"
            fi
          done < <(grep -E "^\s*(info|warning|error)" /tmp/analyze_output.txt || true)

  security-scan:
    name: Security & Architecture Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect project type
        run: |
          if grep -q "project_type: startup_repo" pubspec.yaml 2>/dev/null; then
            echo "PROJECT_TYPE=startup_repo" >> "$GITHUB_ENV"
            echo "🏗️ startup_repo project detected"
          else
            echo "PROJECT_TYPE=standard" >> "$GITHUB_ENV"
          fi

      - name: Security scan (hardcoded secrets)
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(dart|yaml|gradle|swift|kt|plist|xml)$' || true)
          for file in $CHANGED; do
            if [ -f "$file" ]; then
              grep -nE "(password|secret|api_key|apikey|token|private_key)\s*[:=]\s*['\"][^'\"]+['\"]" "$file" --ignore-case | while IFS=: read -r line_num content; do
                echo "::error file=$file,line=$line_num::🔴 Hardcoded secret detected"
              done
            fi
          done

      - name: Code duplication check
        run: |
          CHANGED_DART=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.dart$' || true)
          for file in $CHANGED_DART; do
            if [ -f "$file" ]; then
              LINES=$(wc -l < "$file")
              if [ "$LINES" -gt 300 ]; then
                echo "::warning file=$file::File has $LINES lines (max 300 recommended per startup_repo guide)"
              fi
            fi
          done

      - name: Design system compliance (startup_repo)
        if: env.PROJECT_TYPE == 'startup_repo'
        run: |
          CHANGED_DART=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.dart$' || true)
          for file in $CHANGED_DART; do
            if [ -f "$file" ] && ! echo "$file" | grep -qE "core/(design|utils|theme|common)"; then
              grep -nE "Color\(0x|Colors\." "$file" | while IFS=: read -r ln _; do
                echo "::warning file=$file,line=$ln::🟡 Hardcoded color — use AppColors or Theme"
              done
              grep -nE "EdgeInsets\.(all|symmetric|only)\([0-9]" "$file" | while IFS=: read -r ln _; do
                echo "::warning file=$file,line=$ln::🟡 Hardcoded padding — use AppPadding"
              done
              grep -nE "BorderRadius\.(circular|all)\([0-9]" "$file" | while IFS=: read -r ln _; do
                echo "::warning file=$file,line=$ln::🟡 Hardcoded radius — use AppRadius"
              done
              grep -nE "TextStyle\(" "$file" | while IFS=: read -r ln _; do
                echo "::warning file=$file,line=$ln::🟡 Hardcoded TextStyle — use theme typography (context.font16)"
              done
            fi
          done

      - name: Localization check (startup_repo)
        if: env.PROJECT_TYPE == 'startup_repo'
        run: |
          CHANGED_DART=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.dart$' | grep "presentation/" | grep -v '_test\.dart$' || true)
          for file in $CHANGED_DART; do
            if [ -f "$file" ]; then
              grep -nE "Text\(['\"][A-Z]" "$file" | while IFS=: read -r ln _; do
                echo "::warning file=$file,line=$ln::🟡 Hardcoded string — use '.tr' localization"
              done
            fi
          done

      - name: Performance anti-patterns (startup_repo)
        if: env.PROJECT_TYPE == 'startup_repo'
        run: |
          CHANGED_DART=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.dart$' || true)
          for file in $CHANGED_DART; do
            if [ -f "$file" ]; then
              grep -nE "setState\(" "$file" | while IFS=: read -r ln _; do
                echo "::error file=$file,line=$ln::🔴 setState() in GetX project — use GetBuilder/Obx"
              done
              grep -nE "Image\.network\(" "$file" | grep -v "PrimaryNetworkImage\|cached" | while IFS=: read -r ln _; do
                echo "::warning file=$file,line=$ln::🟡 Uncached Image.network — use PrimaryNetworkImage"
              done
            fi
          done

      - name: Architecture compliance (startup_repo)
        if: env.PROJECT_TYPE == 'startup_repo'
        run: |
          CHANGED_DART=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.dart$' || true)
          for file in $CHANGED_DART; do
            if echo "$file" | grep -q "features/" && ! echo "$file" | grep -qE "/(data|domain|presentation)/"; then
              echo "::warning file=$file::🟡 File not in standard feature structure (data/domain/presentation)"
            fi
          done

  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, code-quality, security-scan]
    if: always()
    env:
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get diff
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(dart|yaml)$' > /tmp/changed_files.txt || true
          FILE_COUNT=$(wc -l < /tmp/changed_files.txt | tr -d ' ')
          echo "file_count=$FILE_COUNT" >> "$GITHUB_ENV"
          if [ "$FILE_COUNT" != "0" ]; then
            FILES=$(cat /tmp/changed_files.txt | tr '\n' ' ')
            git diff origin/${{ github.base_ref }}...HEAD -- $FILES | head -c 30000 > /tmp/diff.txt
          fi

      - name: Detect project type
        run: |
          if grep -q "project_type: startup_repo" pubspec.yaml 2>/dev/null; then
            echo "PROJECT_TYPE=startup_repo" >> "$GITHUB_ENV"
          else
            echo "PROJECT_TYPE=standard" >> "$GITHUB_ENV"
          fi

      - name: AI Review
        if: env.file_count != '0'
        run: |
          GUIDE=""
          if [ "$PROJECT_TYPE" = "startup_repo" ]; then
            GUIDE="This project follows startup_repo architecture (Clean Architecture + GetX). Enforce:
          - Colors via design system (AppColors) not hardcoded Color(0x...)
          - Padding via AppPadding not EdgeInsets.all(n)
          - Radius via AppRadius not BorderRadius.circular(n)
          - Typography via theme (context.font16) not TextStyle()
          - Strings via .tr localization not hardcoded
          - GetBuilder/Obx not setState
          - Feature structure: data/{model,repository} domain/{binding,service} presentation/{controller,view}
          - Interfaces for repos and services (*_interface.dart)
          - Max 300 lines per file
          - Use PrimaryNetworkImage for cached images"
          fi

          echo "You are a senior Flutter code reviewer. Review this PR diff." > /tmp/prompt.txt
          echo "" >> /tmp/prompt.txt
          if [ -n "$GUIDE" ]; then echo "$GUIDE" >> /tmp/prompt.txt; echo "" >> /tmp/prompt.txt; fi
          echo "Changed files:" >> /tmp/prompt.txt
          cat /tmp/changed_files.txt >> /tmp/prompt.txt
          echo "" >> /tmp/prompt.txt
          echo "Diff:" >> /tmp/prompt.txt
          cat /tmp/diff.txt >> /tmp/prompt.txt
          echo "" >> /tmp/prompt.txt
          echo 'IMPORTANT: Respond ONLY with a valid JSON array. No markdown, no explanation, no code blocks.' >> /tmp/prompt.txt
          echo 'Each element must be an object with keys: "path" (string), "line" (integer > 0), "severity" ("blocker"|"major"|"minor"), "body" (string).' >> /tmp/prompt.txt
          echo 'Example: [{"path":"lib/main.dart","line":5,"severity":"major","body":"Hardcoded color"}]' >> /tmp/prompt.txt
          echo 'If no issues found, respond with: []' >> /tmp/prompt.txt

          jq -Rs '{model:"moonshotai/Kimi-K2.5",messages:[{role:"user",content:.}],temperature:0.1,max_tokens:4096}' /tmp/prompt.txt > /tmp/request.json

          curl -s -X POST "https://api.together.xyz/v1/chat/completions" \
            -H "Authorization: Bearer $TOGETHER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/request.json | jq -r '.choices[0].message.content // empty' > /tmp/review_raw.txt

          if [ ! -s /tmp/review_raw.txt ]; then
            echo "AI review returned empty"
            echo "[]" > /tmp/review.json
            exit 0
          fi

          # Extract JSON array from response (strip markdown fences if present)
          sed 's/^```json//;s/^```//' /tmp/review_raw.txt | jq '.' > /tmp/review.json 2>/dev/null || echo "[]" > /tmp/review.json

          cat /tmp/review.json

      - name: Post inline review
        if: env.file_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comments = [];
            try {
              const raw = fs.readFileSync('/tmp/review.json', 'utf8').trim();
              comments = JSON.parse(raw);
              if (!Array.isArray(comments)) comments = [];
            } catch (e) {
              console.log('Failed to parse AI review JSON:', e.message);
              // Fallback: post raw review as single comment
              const rawText = fs.readFileSync('/tmp/review_raw.txt', 'utf8');
              if (rawText && rawText.trim().length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: '🤖 **AI Code Review**\n\n' + rawText
                });
              }
              return;
            }

            if (comments.length === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '🤖 **AI Code Review**: No issues found. Looks good! ✅'
              });
              return;
            }

            // Get PR files to validate paths and extract diff line ranges
            const { data: prFiles } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Build map of valid file paths and their changed line ranges
            const fileLineMap = {};
            for (const f of prFiles) {
              const lines = new Set();
              if (f.patch) {
                const matches = f.patch.matchAll(/@@\s*-\d+(?:,\d+)?\s*\+(\d+)(?:,(\d+))?\s*@@/g);
                for (const m of matches) {
                  const start = parseInt(m[1]);
                  const count = parseInt(m[2] || '1');
                  for (let i = start; i < start + count; i++) lines.add(i);
                }
              }
              fileLineMap[f.filename] = lines;
            }

            // Build review comments (only for files/lines in the PR diff)
            const reviewComments = [];
            const orphanComments = [];

            for (const c of comments) {
              const severity = c.severity === 'blocker' ? '🔴' : c.severity === 'major' ? '🟡' : '🟢';
              const body = `${severity} **${c.severity?.toUpperCase() || 'INFO'}**: ${c.body}`;
              const fileLines = fileLineMap[c.path];

              if (fileLines && c.line > 0 && fileLines.has(c.line)) {
                reviewComments.push({
                  path: c.path,
                  line: c.line,
                  side: 'RIGHT',
                  body: body
                });
              } else {
                orphanComments.push(`**${c.path || 'general'}${c.line ? ':' + c.line : ''}** — ${body}`);
              }
            }

            // Count by severity
            const blockers = comments.filter(c => c.severity === 'blocker').length;
            const majors = comments.filter(c => c.severity === 'major').length;
            const minors = comments.filter(c => c.severity === 'minor').length;

            const event = blockers > 0 ? 'REQUEST_CHANGES' : 'COMMENT';
            const summary = `🤖 **AI Code Review Summary**\n\n| Severity | Count |\n|----------|-------|\n| 🔴 Blocker | ${blockers} |\n| 🟡 Major | ${majors} |\n| 🟢 Minor | ${minors} |\n| **Total** | **${comments.length}** |`;

            let fullBody = summary;
            if (orphanComments.length > 0) {
              fullBody += '\n\n**General comments:**\n' + orphanComments.map(c => '- ' + c).join('\n');
            }

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: event,
                body: fullBody,
                comments: reviewComments.slice(0, 50)
              });
            } catch (e) {
              console.log('Inline review failed, falling back to comment:', e.message);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody + '\n\n' + reviewComments.map(c => `- **${c.path}:${c.line}** — ${c.body}`).join('\n')
              });
            }

      - name: Skip notice
        if: env.file_count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 AI Review: No code files changed.'
            });
