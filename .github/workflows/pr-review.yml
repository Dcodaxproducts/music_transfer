name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files and diff
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(dart|yaml)$' || true)
          FILE_COUNT=$(echo "$FILES" | grep -c '.' || echo "0")
          echo "count=$FILE_COUNT" >> "$GITHUB_ENV"
          echo "$FILES" > /tmp/changed_files.txt
          if [ -n "$FILES" ]; then
            git diff origin/${{ github.base_ref }}...HEAD -- $FILES | head -c 30000 > /tmp/diff.txt
          else
            echo "" > /tmp/diff.txt
          fi

      - name: AI Review
        if: env.count != '0'
        run: |
          echo "Review this Flutter PR diff. Provide: Summary, What Looks Good, Issues Found, Suggestions, Security Notes." > /tmp/prompt.txt
          echo "" >> /tmp/prompt.txt
          echo "Changed files:" >> /tmp/prompt.txt
          cat /tmp/changed_files.txt >> /tmp/prompt.txt
          echo "" >> /tmp/prompt.txt
          echo "Diff:" >> /tmp/prompt.txt
          cat /tmp/diff.txt >> /tmp/prompt.txt

          jq -Rs '{model:"moonshotai/Kimi-K2.5",messages:[{role:"user",content:.}],temperature:0.3,max_tokens:4096}' /tmp/prompt.txt > /tmp/request.json

          curl -s -X POST "https://api.together.xyz/v1/chat/completions" \
            -H "Authorization: Bearer $TOGETHER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/request.json | jq -r '.choices[0].message.content // empty' > /tmp/review.txt

          if [ ! -s /tmp/review.txt ]; then
            echo "AI review returned empty"
            exit 1
          fi
          echo "Review generated successfully"

      - name: Post review comment
        if: env.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.txt', 'utf8');
            if (!review || review.trim().length === 0) {
              throw new Error('Empty review');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 AI Review\n\n' + review
            });

      - name: Skip notice
        if: env.count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 AI Review: No code files changed.'
            });
