name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle
  push:
    branches: [testing, production]

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
      MATTERMOST_TOKEN: ${{ secrets.MATTERMOST_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf "%s" "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "storeFile=../app/upload-keystore.jks" > android/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties

      - name: Set build type
        run: echo "BUILD_TYPE=${{ github.event.inputs.build_type || 'apk' }}" >> $GITHUB_ENV

      - name: Build APK
        if: env.BUILD_TYPE == 'apk'
        run: flutter build apk --release

      - name: Build App Bundle
        if: env.BUILD_TYPE == 'appbundle'
        run: flutter build appbundle --release

      - name: Upload to S3
        if: success()
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          SHA="${{ github.sha }}"
          if [ "$BUILD_TYPE" == "apk" ]; then
            aws s3 cp build/app/outputs/flutter-apk/app-release.apk "s3://$AWS_BUCKET_NAME/builds/$REPO_NAME/$SHA/app-release.apk"
            echo "URL=https://$AWS_BUCKET_NAME.s3.$AWS_REGION.amazonaws.com/builds/$REPO_NAME/$SHA/app-release.apk" >> $GITHUB_ENV
          else
            aws s3 cp build/app/outputs/bundle/release/app-release.aab "s3://$AWS_BUCKET_NAME/builds/$REPO_NAME/$SHA/app-release.aab"
            echo "URL=https://$AWS_BUCKET_NAME.s3.$AWS_REGION.amazonaws.com/builds/$REPO_NAME/$SHA/app-release.aab" >> $GITHUB_ENV
          fi

      - name: Notify Mattermost
        if: always()
        run: |
          STATUS="${{ job.status }}"
          REPO="${{ github.repository }}"
          REPO_SHORT=$(echo "$REPO" | cut -d/ -f2)
          BRANCH="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$STATUS" = "success" ]; then
            MSG="🤖 Android $BUILD_TYPE build passed for $REPO_SHORT ($BRANCH)"
            if [ -n "$URL" ]; then
              MSG="$MSG\nDownload: $URL"
            fi
          else
            MSG="🤖 Android build failed for $REPO_SHORT ($BRANCH)\nLogs: $RUN_URL"
          fi
          jq -n \
            --arg channel "bwgii3aooiy39cpy1tu7tcp6tc" \
            --arg message "$MSG" \
            '{channel_id: $channel, message: $message}' | \
          curl -s -X POST "$MATTERMOST_URL/api/v4/posts" \
            -H "Authorization: Bearer $MATTERMOST_TOKEN" \
            -H "Content-Type: application/json" \
            -d @-
